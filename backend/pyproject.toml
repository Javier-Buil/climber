[project]
name = "climber-backend"
version = "0.1.0"
description = "API serving climbing spots, routes and hold maps for the Climber recon app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
